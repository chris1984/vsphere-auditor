default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "vsphere_auditor") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  <<: *default
  database: vsphere_auditor_development

test:
  <<: *default
  database: vsphere_auditor_test

production:
  primary:
    <<: *default
    database: vsphere_auditor_production
  cache:
    <<: *default
    database: vsphere_auditor_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: vsphere_auditor_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: vsphere_auditor_production_cable
    migrations_paths: db/cable_migrate
