collect_vcenter_events:
  class: CollectEventsJob
  schedule: every 5 minutes

send_daily_report:
  class: DailyReportJob
  schedule: "0 7 * * *"

send_weekly_report:
  class: WeeklyReportJob
  schedule: "0 7 * * 1"

purge_old_events:
  class: DataRetentionJob
  schedule: "0 2 1 * *"

production:
  collect_vcenter_events:
    class: CollectEventsJob
    schedule: every 5 minutes

  send_daily_report:
    class: DailyReportJob
    schedule: "0 7 * * *"

  send_weekly_report:
    class: WeeklyReportJob
    schedule: "0 7 * * 1"

  purge_old_events:
    class: DataRetentionJob
    schedule: "0 2 1 * *"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: "12 * * * *"
